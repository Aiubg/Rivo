<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#FFFFFF" />
		<script>
			(function () {
				try {
					var DEFAULT_THEME_ID = 'neutral';
					var THEME_STORAGE_KEY = 'rivo:v1:preference:color-theme';
					var LEGACY_THEME_STORAGE_KEY = 'app-color-theme';
					var presetThemes = { neutral: true, claude: true };

					var storedThemeId =
						localStorage.getItem(THEME_STORAGE_KEY) ||
						localStorage.getItem(LEGACY_THEME_STORAGE_KEY);
					var themeId = presetThemes[storedThemeId] ? storedThemeId : DEFAULT_THEME_ID;
					if (themeId !== storedThemeId) {
						localStorage.setItem(THEME_STORAGE_KEY, themeId);
					}
					localStorage.removeItem(LEGACY_THEME_STORAGE_KEY);
					document.documentElement.setAttribute('data-theme', themeId);

					var mode = localStorage.getItem('mode-watcher-mode') || 'system';
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
					document.documentElement.classList.toggle('dark', isDark);
					localStorage.removeItem('app-theme-tokens');
				} catch (e) {
					return;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="antialiased" data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
